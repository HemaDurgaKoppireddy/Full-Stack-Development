<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CodeDelight Compiler</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #222;
      color: #fff;
    }
    header select, header button {
      margin-left: 10px;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    header button {
      background: #444;
      color: #fff;
    }
    header button:hover {
      background: #666;
    }
    #container {
      display: flex;
      flex-direction: row;
      height: calc(100vh - 50px);
    }
    #editor {
      flex: 1;
      min-height: 50vh;
    }
    #rightPanel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      background: #fafafa;
    }
    #input, #output {
      flex: 1;
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: monospace;
      background: #fff;
      resize: none;
    }
    #output {
      background: #eee;
      white-space: pre-wrap;
    }
    @media (max-width: 768px) {
      #container {
        flex-direction: column;
      }
      #editor, #rightPanel {
        height: 50vh;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <label for="languageSelector">Language:</label>
      <select id="languageSelector">
        <option value="c">C</option>
        <option value="cpp">C++</option>
        <option value="java">Java</option>
        <option value="python">Python</option>
      </select>
    </div>
    <div>
      <button id="runBtn">Run</button>
      <button id="clearBtn">Clear</button>
      <button id="downloadBtn">Download</button>
      <button id="themeBtn">Toggle Theme</button>
    </div>
  </header>

  <div id="container">
    <div id="editor"></div>
    <div id="rightPanel">
      <textarea id="input" placeholder="Enter input here..."></textarea>
      <pre id="output"></pre>
    </div>
  </div>

  <!-- Monaco Editor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs/loader.min.js"></script>
  <script>
    let editor;
    let darkMode = true;

    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs' }});
    require(["vs/editor/editor.main"], function () {
      editor = monaco.editor.create(document.getElementById("editor"), {
        value: "// Write your code here...",
        language: "cpp",
        theme: "vs-dark",
        automaticLayout: true
      });
    });

    // Change language
    document.getElementById("languageSelector").addEventListener("change", (e) => {
      monaco.editor.setModelLanguage(editor.getModel(), e.target.value);
    });

    // Run code
    document.getElementById("runBtn").addEventListener("click", async () => {
      const code = editor.getValue();
      const language = document.getElementById("languageSelector").value;
      const input = document.getElementById("input").value;

      document.getElementById("output").textContent = "Running...";

      try {
        const response = await fetch("https://compilerapi.jami.ltd/execute", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ language, code, input })
        });
        const result = await response.json();
        document.getElementById("output").textContent = result.output || result.error;
      } catch (err) {
        document.getElementById("output").textContent = "Error: " + err.message;
      }
    });

    // Clear editor & panels
    document.getElementById("clearBtn").addEventListener("click", () => {
      editor.setValue("");
      document.getElementById("input").value = "";
      document.getElementById("output").textContent = "";
    });

    // Toggle theme
    document.getElementById("themeBtn").addEventListener("click", () => {
      darkMode = !darkMode;
      monaco.editor.setTheme(darkMode ? "vs-dark" : "vs-light");
    });

    // Download file with custom filename
    document.getElementById("downloadBtn").addEventListener("click", () => {
      const code = editor.getValue();
      const language = document.getElementById("languageSelector").value;

      // Decide file extension
      let extension = "txt"; 
      if (language === "c") extension = "c";
      else if (language === "cpp") extension = "cpp";
      else if (language === "java") extension = "java";
      else if (language === "python") extension = "py";

      // Ask user for a filename
      let filename = prompt("Enter filename (without extension):", "program");

      // If user cancels or leaves blank, use default
      if (!filename || filename.trim() === "") {
        filename = "program";
      }

      // Create and download file
      const blob = new Blob([code], { type: "text/plain" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = `${filename}.${extension}`;
      a.click();

      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
