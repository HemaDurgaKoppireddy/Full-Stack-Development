<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
  <style>
    /* Floating button */
    #chat-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0078ff;
      color: white;
      padding: 12px 16px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
      z-index: 1000;
    }

    /* Chat widget */
    #chat-widget {
      position: fixed;
      bottom: 70px;
      right: 20px;
      width: 300px;
      height: 400px;
      background: white;
      border-radius: 12px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.3);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 1000;
    }

    #chat-header {
      background: #0078ff;
      color: white;
      padding: 10px;
      text-align: center;
      font-weight: bold;
    }

    #chat-box {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-size: 14px;
    }

    #chat-box p {
      margin: 6px 0;
      padding: 8px;
      border-radius: 6px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .user-msg {
      background: #0078ff;
      color: white;
      text-align: right;
      margin-left: auto;
    }

    .bot-msg {
      background: #f1f1f1;
      text-align: left;
      margin-right: auto;
    }

    #chat-input-area {
      display: flex;
      border-top: 1px solid #ddd;
    }

    #chat-input-area input {
      flex: 1;
      border: none;
      padding: 10px;
      font-size: 14px;
      outline: none;
    }

    #chat-input-area button {
      background: #0078ff;
      border: none;
      color: white;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <!-- Floating Chat Button -->
  <div id="chat-toggle">💬</div>

  <!-- Chat Widget -->
  <div id="chat-widget">
    <div id="chat-header">AI Chatbot</div>
    <div id="chat-box"></div>
    <div id="chat-input-area">
      <input type="text" id="user-input" placeholder="Type a message..." />
      <button id="send-btn">➤</button>
    </div>
  </div>

  <script>
    const chatToggle = document.getElementById("chat-toggle");
    const chatWidget = document.getElementById("chat-widget");
    const sendBtn = document.getElementById("send-btn");
    const userInput = document.getElementById("user-input");
    const chatBox = document.getElementById("chat-box");

    // Toggle open/close
    chatToggle.onclick = () => {
      chatWidget.style.display = chatWidget.style.display === "flex" ? "none" : "flex";
    };

    // Send message
    sendBtn.onclick = sendMessage;
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    async function sendMessage() {
      let msg = userInput.value.trim();
      if (!msg) return;

      // Add user message
      addMessage(msg, "user-msg");
      userInput.value = "";

      // Add temporary "Typing..."
      let tempMsg = addMessage("Typing...", "bot-msg");

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer YOUR_API_KEY_HERE`
          },
          body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: [{ role: "user", content: msg }]
          })
        });

        const data = await response.json();
        chatBox.removeChild(tempMsg); // remove "Typing..."
        addMessage(data.choices[0].message.content, "bot-msg");
      } catch (error) {
        chatBox.removeChild(tempMsg);
        addMessage("⚠️ Error connecting to AI", "bot-msg");
      }
    }

    // Utility function to add messages
    function addMessage(text, className) {
      let p = document.createElement("p");
      p.className = className;
      p.textContent = text;
      chatBox.appendChild(p);
      chatBox.scrollTop = chatBox.scrollHeight;
      return p;
    }
  </script>
</body>
</html>
